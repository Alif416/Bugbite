[project]
name = "bugbite"
version = "0.1.0"
description = "An autonomous issue-fixing agent that opens evidence-backed pull requests."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bugbite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
