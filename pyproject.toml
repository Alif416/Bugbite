[project]
name = "bugbite"
version = "0.1.0"
description = "An autonomous issue-fixing agent that opens evidence-backed pull requests."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3.0",
    "docker>=7.2.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bugbite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: needs a running Docker daemon (skipped when Docker is unreachable)",
    "internet: needs internet access to pypi.org and github.com (skipped when unreachable)",
]
