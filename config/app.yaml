# App-wide limits. Secrets never go in this file; use environment variables.
default_model: haiku   # must be a key in models.yaml
max_steps: 30          # hard cap per job
max_cost_usd: 0.10     # hard cap per job
max_wall_clock_s: 600  # hard cap per job (10 minutes)
total_budget_usd: 5.0  # whole-project API budget

# Sandbox container settings (all optional; these are the defaults).
sandbox:
  image: bugbite-sandbox:py3.11-1   # built from docker/sandbox.Dockerfile on first use
  cpus: 1
  memory_mb: 2048          # no swap
  pids_limit: 256          # stops fork bombs
  command_timeout_s: 120   # per command
  max_output_bytes: 1048576  # per stream
  max_lifetime_s: 1800     # container removes itself after this
  workspace_mb: 2048       # soft cap on /workspace disk use
  setup_timeout_s: 900     # per clone/install step
  test_timeout_s: 300      # per full test run
