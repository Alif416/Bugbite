# One entry per model. Prices live in each model's `pricing` block: US dollars per million tokens
# (explicit zeros for free models).
models:
  haiku:
    # Claude Haiku 5.5. Values read from the official pages (platform.claude.com pricing and models
    # overview) on 2026-11-01; re-check them, and record the date, before each paid benchmark run.
    provider: claude
    base_url: https://api.anthropic.com
    model_name: claude-haiku-5-5
    context_window: 1000000
    native_tool_calling: true
    pricing:
      # US dollars per million tokens, read from the provider's pricing page.
      as_of: 2026-11-01
      source: https://platform.claude.com/docs/en/about-claude/pricing
      input: 0.10
      output: 0.50
      cache_read: 0.01
      cache_write: 0.125         # 5-minute cache writes (what the adapter uses); 1-hour writes cost $0.20
      long_prompt:               # calls with a prompt of MORE than over_tokens (cache tokens count) use this card
        over_tokens: 100000
        input: 0.50
        output: 2.50
        cache_read: 0.05
        cache_write: 0.625
    per_issue_cap_usd: 0.10
    # Whether Anthropic's API terms suit your private code is your decision. Keep false until you have read
    # them (and note the date); with false, Haiku only works on public repos and your sandbox_repos.
    allow_private_code: false
    api_key_env: ANTHROPIC_API_KEY
    max_output_tokens: 4096
    prompt_caching: auto

  local-free:
    # Placeholder until the owner picks a free model (README open question 4).
    provider: openai_compatible
    base_url: http://localhost:11434/v1
    model_name: replace-me
    context_window: 32768
    native_tool_calling: false
    pricing:
      input: 0
      output: 0
    per_issue_cap_usd: 0
    allow_private_code: true   # runs on your own machine, so private code does not leave it
    max_output_tokens: 4096   # no api_key_env: local models need no key

  groq-free:
    # Free hosted tier. EVERY value below that is specific to Groq is UNVERIFIED (it came from third-party
    # pages on 2026-11-01). Confirm the model, context window, tool-calling support, rate limits and data
    # terms on Groq's own pages (console.groq.com) before the first real run, and record the date.
    # Free hosted tiers may use prompts for training, so public repos only (allow_private_code: false).
    provider: openai_compatible
    base_url: https://api.groq.com/openai/v1
    model_name: openai/gpt-oss-120b   # confirm
    context_window: 131072            # confirm
    native_tool_calling: true         # confirm
    pricing:
      input: 0
      output: 0
    per_issue_cap_usd: 0
    allow_private_code: false
    api_key_env: GROQ_API_KEY
    max_output_tokens: 4096
